<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sơ đồ tổ chức - Yaskawa Electric Việt Nam</title>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }
#header { background: linear-gradient(135deg, #0078d4, #005a9e); color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
#header h1 { font-size: 17px; font-weight: 600; }
#toolbar { background: white; padding: 10px 20px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
#toolbar button { padding: 6px 16px; border: 1px solid #0078d4; color: #0078d4; background: white; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
#toolbar button:hover { background: #0078d4; color: white; }
#zoom-label { font-size: 12px; color: #888; margin-left: 4px; }
#search-box { margin-left: auto; padding: 6px 12px; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; width: 200px; outline: none; }
#search-box:focus { border-color: #0078d4; }
#login-screen { text-align: center; padding: 80px 20px; }
#login-screen h2 { font-size: 20px; color: #333; margin-bottom: 12px; }
#login-screen p { color: #666; margin-bottom: 24px; }
#login-btn { padding: 12px 32px; background: #0078d4; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
#login-btn:hover { background: #005a9e; }
#loading { text-align: center; padding: 80px 20px; display: none; }
#loading .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #0078d4; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
#error-box { text-align: center; padding: 60px; color: #c00; display: none; }
#chart-wrap { overflow: auto; padding: 32px 20px; display: none; }
#chart-scale { transform-origin: top center; transition: transform 0.2s; display: inline-block; min-width: 100%; }
.tree-root { display: flex; flex-direction: column; align-items: center; }
.node-group { display: flex; flex-direction: column; align-items: center; }
.children-row { display: flex; justify-content: center; align-items: flex-start; position: relative; padding-top: 40px; }
.children-row.multi::before { content: ''; position: absolute; top: 20px; left: 0; right: 0; border-top: 2px solid #0078d4; }
.children-row:not(.multi)::before { content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 20px; background: #0078d4; }
.child-col { display: flex; flex-direction: column; align-items: center; padding: 0 12px; position: relative; }
.child-col.multi::before { content: ''; position: absolute; top: -20px; left: 50%; width: 2px; height: 20px; background: #0078d4; }
.card { background: white; border: 1.5px solid #d0e4f7; border-radius: 10px; padding: 12px 16px; min-width: 150px; max-width: 190px; text-align: center; cursor: pointer; transition: all 0.2s; }
.card:hover { border-color: #0078d4; box-shadow: 0 4px 16px rgba(0,120,212,0.15); transform: translateY(-2px); }
.card.highlighted { border-color: #ff8c00; background: #fff8f0; }
.card.root-card { border-color: #0078d4; background: linear-gradient(135deg, #e8f4fd, #f0f8ff); }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; margin: 0 auto 8px; color: white; }
.card-name { font-size: 13px; font-weight: 600; color: #1a1a1a; line-height: 1.3; margin-bottom: 3px; }
.card-title { font-size: 11px; color: #555; line-height: 1.3; margin-bottom: 2px; }
.card-dept { font-size: 10px; color: #0078d4; font-weight: 500; }
.v-line { width: 2px; height: 24px; background: #0078d4; margin: 0 auto; }
.stat-bar { font-size: 12px; color: #888; background: #f0f4f8; padding: 3px 10px; border-radius: 10px; }
</style>
</head>
<body>

<div id="header">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="6" rx="2" fill="white"/><rect x="2" y="14" width="6" height="6" rx="2" fill="white"/><rect x="16" y="14" width="6" height="6" rx="2" fill="white"/><path d="M12 8v3M12 11H7v3M12 11h5v3" stroke="white" stroke-width="1.5"/></svg>
  <h1>Sơ đồ tổ chức — Công ty TNHH Yaskawa Electric Việt Nam</h1>
</div>

<div id="toolbar" style="display:none">
  <button onclick="zoom(0.15)">＋ Phóng to</button>
  <button onclick="zoom(-0.15)">－ Thu nhỏ</button>
  <button onclick="resetZoom()">↺ Khôi phục</button>
  <button onclick="loadChart()">⟳ Làm mới</button>
  <span class="zoom-label" id="zoom-label">100%</span>
  <input id="search-box" type="text" placeholder="🔍 Tìm tên nhân viên..." oninput="search(this.value)">
  <span class="stat-bar" id="stat-total"></span>
</div>

<div id="login-screen">
  <h2>🏢 Sơ đồ tổ chức Yaskawa</h2>
  <p>Vui lòng đăng nhập bằng tài khoản Microsoft 365 của công ty</p>
  <button id="login-btn" onclick="login()">Đăng nhập với Microsoft</button>
</div>

<div id="loading"><div class="spinner"></div><p>Đang tải dữ liệu nhân viên...</p></div>
<div id="error-box"></div>
<div id="chart-wrap"><div id="chart-scale"></div></div>

<script>
const msalConfig = {
  auth: {
    clientId: '35767111-bc1e-4db5-abdb-571813a26405',
    authority: 'https://login.microsoftonline.com/bbcda3c2-d590-46cf-aedc-8bcc27bf5269',
    redirectUri: window.location.href.split('?')[0]
  }
};

const msalInstance = new msal.PublicClientApplication(msalConfig);
const scopes = ['User.Read.All'];
let scale = 1;
const colors = ['#0078d4','#107c10','#d83b01','#5c2d91','#008272','#004b50','#a4262c','#0e7a0d'];

function getColor(name) {
  let h = 0; for (let c of (name||'')) h = (h*31+c.charCodeAt(0))%colors.length;
  return colors[Math.abs(h)];
}
function initials(name) {
  if (!name) return '?';
  const p = name.trim().split(/\s+/);
  return p.length >= 2 ? (p[0][0]+p[p.length-1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
}
function zoom(d) { scale = Math.min(2, Math.max(0.3, scale+d)); applyZoom(); }
function resetZoom() { scale = 1; applyZoom(); }
function applyZoom() {
  document.getElementById('chart-scale').style.transform = `scale(${scale})`;
  document.getElementById('zoom-label').textContent = Math.round(scale*100)+'%';
}
function search(q) {
  document.querySelectorAll('.card').forEach(c => {
    c.classList.remove('highlighted');
    if (q && c.dataset.name && c.dataset.name.toLowerCase().includes(q.toLowerCase())) {
      c.classList.add('highlighted');
      c.scrollIntoView({behavior:'smooth', block:'center'});
    }
  });
}

async function login() {
  try {
    await msalInstance.initialize();
    const result = await msalInstance.loginPopup({ scopes });
    msalInstance.setActiveAccount(result.account);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('toolbar').style.display = 'flex';
    loadChart();
  } catch(e) {
    alert('Lỗi đăng nhập: ' + e.message);
  }
}

async function getToken() {
  await msalInstance.initialize();
  const account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
  if (!account) throw new Error('Chưa đăng nhập');
  const result = await msalInstance.acquireTokenSilent({ scopes, account });
  return result.accessToken;
}

async function fetchAll(token, url) {
  let items = [];
  while (url) {
    const r = await fetch(url, {headers:{Authorization:'Bearer '+token}});
    const d = await r.json();
    items = items.concat(d.value||[]);
    url = d['@odata.nextLink']||null;
  }
  return items;
}

function buildCard(user, isRoot) {
  const color = getColor(user.displayName);
  return `<div class="card ${isRoot?'root-card':''}" data-name="${user.displayName||''}">
    <div class="avatar" style="background:${color}">${initials(user.displayName)}</div>
    <div class="card-name">${user.displayName||''}</div>
    <div class="card-title">${user.jobTitle||'&nbsp;'}</div>
    <div class="card-dept">${user.department||''}</div>
  </div>`;
}

function buildTree(id, childMap, userMap, isRoot) {
  const user = userMap[id];
  if (!user) return '';
  const children = childMap[id]||[];
  const multi = children.length > 1;
  let html = `<div class="node-group">${buildCard(user, isRoot)}`;
  if (children.length > 0) {
    html += `<div class="v-line"></div><div class="children-row ${multi?'multi':''}">`;
    children.forEach(cid => {
      html += `<div class="child-col ${multi?'multi':''}">${buildTree(cid, childMap, userMap, false)}</div>`;
    });
    html += `</div>`;
  }
  return html + `</div>`;
}

async function loadChart() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('chart-wrap').style.display = 'none';

  try {
    const token = await getToken();
    const users = await fetchAll(token, 'https://graph.microsoft.com/v1.0/users?$select=id,displayName,jobTitle,department,mail&$filter=accountEnabled eq true&$top=100');
    const real = users.filter(u => u.displayName && !u.displayName.includes('#EXT#') && !u.displayName.toLowerCase().includes('room') && !u.displayName.toLowerCase().includes('car '));

    const managerMap = {};
    const batch = 10;
    for (let i = 0; i < real.length; i += batch) {
      await Promise.all(real.slice(i, i+batch).map(async u => {
        try {
          const r = await fetch(`https://graph.microsoft.com/v1.0/users/${u.id}/manager?$select=id`, {headers:{Authorization:'Bearer '+token}});
          if (r.ok) { const d = await r.json(); if (d.id) managerMap[u.id] = d.id; }
        } catch {}
      }));
    }

    const userMap = {};
    real.forEach(u => userMap[u.id] = u);
    const childMap = {};
    const hasParent = new Set();
    real.forEach(u => {
      const mgr = managerMap[u.id];
      if (mgr && userMap[mgr]) {
        if (!childMap[mgr]) childMap[mgr] = [];
        childMap[mgr].push(u.id);
        hasParent.add(u.id);
      }
    });

    const roots = real.filter(u => !hasParent.has(u.id));
    document.getElementById('stat-total').textContent = real.length + ' nhân viên';

    let html = '<div class="tree-root">';
    roots.forEach(r => html += buildTree(r.id, childMap, userMap, true));
    html += '</div>';

    document.getElementById('chart-scale').innerHTML = html;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('chart-wrap').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('error-box').innerHTML = `<h3>❌ Lỗi</h3><p>${e.message}</p>`;
  }
}

// Auto login if already signed in
msalInstance.initialize().then(() => {
  const accounts = msalInstance.getAllAccounts();
  if (accounts.length > 0) {
    msalInstance.setActiveAccount(accounts[0]);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('toolbar').style.display = 'flex';
    loadChart();
  }
});
</script>
</body>
</html>
